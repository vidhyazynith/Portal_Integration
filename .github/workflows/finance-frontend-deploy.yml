name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: finance-frontend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          # 20 minutes is okay for npm ci + build,
          # but SSH connection itself must also be working.
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            echo "======================================"
            echo "Finance Frontend Deployment"
            echo "======================================"

            trap 'echo "ERROR: Deployment failed at line $LINENO"' ERR

            # ======================================
            # Configuration
            # ======================================

            REPO="$HOME/Portals/Portal_Integration"
            FRONTEND="$REPO/frontend"
            DEPLOY_DIR="/var/www/finance"

            API_URL="https://finance.zynith-it.com/api"
            FRONTEND_URL="https://finance.zynith-it.com"

            OLD_API_IP="16.112.200.177"

            # ======================================
            # Load Node / NVM
            # ======================================

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM not found"
              exit 1
            fi

            source "$NVM_DIR/nvm.sh"

            nvm use 20

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            # ======================================
            # Repository
            # ======================================

            cd "$REPO"

            echo "Repository:"
            pwd

            echo "Current remote:"
            git remote -v

            # ======================================
            # Git
            # ======================================

            echo "=== Checking Git locks ==="

            rm -f "$REPO/.git/index.lock"
            rm -f "$REPO/.git/refs/remotes/origin/main.lock"

            echo "=== Fetching latest main ==="

            git fetch origin main --prune

            echo "=== Resetting repository ==="

            git reset --hard origin/main

            echo "=== Current commit ==="

            git log -1 --oneline

            # ======================================
            # Frontend
            # ======================================

            cd "$FRONTEND"

            echo "Frontend directory:"
            pwd

            # ======================================
            # Install dependencies
            # ======================================

            echo "=== Installing dependencies ==="

            rm -rf node_modules

            npm ci

            # ======================================
            # Clean build
            # ======================================

            echo "=== Removing previous dist ==="

            rm -rf dist

            echo "=== Building frontend ==="

            npm run build

            echo "=== Build completed ==="

            # ======================================
            # Validate build
            # ======================================

            if [ ! -f "$FRONTEND/dist/index.html" ]; then
              echo "ERROR: dist/index.html not found"
              exit 1
            fi

            if [ ! -d "$FRONTEND/dist/assets" ]; then
              echo "ERROR: dist/assets not found"
              exit 1
            fi

            echo "=== Generated index.html ==="

            cat "$FRONTEND/dist/index.html"

            # ======================================
            # Validate API URL
            # ======================================

            echo "=== Checking old API IP ==="

            if grep -R -F "$OLD_API_IP" "$FRONTEND/dist" >/dev/null 2>&1; then
              echo "ERROR: Old API IP found in frontend build"
              grep -R -F "$OLD_API_IP" "$FRONTEND/dist" || true
              exit 1
            fi

            echo "Old API IP not found."

            echo "=== Checking HTTPS API URL ==="

            if ! grep -R -F "$API_URL" "$FRONTEND/dist" >/dev/null 2>&1; then
              echo "ERROR: HTTPS API URL not found"
              exit 1
            fi

            echo "HTTPS API URL verified."

            # ======================================
            # Deploy to Nginx root
            # ======================================

            echo "======================================"
            echo "Deploying to Nginx"
            echo "======================================"

            sudo mkdir -p "$DEPLOY_DIR"

            # Install rsync if necessary
            if ! command -v rsync >/dev/null 2>&1; then
              echo "Installing rsync..."
              sudo dnf install -y rsync
            fi

            echo "=== Syncing dist to Nginx root ==="

            sudo rsync -a --delete \
              "$FRONTEND/dist/" \
              "$DEPLOY_DIR/"

            # ======================================
            # Permissions
            # ======================================

            echo "=== Setting permissions ==="

            sudo chown -R nginx:nginx "$DEPLOY_DIR"

            sudo find "$DEPLOY_DIR" \
              -type d \
              -exec chmod 755 {} \;

            sudo find "$DEPLOY_DIR" \
              -type f \
              -exec chmod 644 {} \;

            # ======================================
            # Verify deployed index
            # ======================================

            echo "=== Deployed index.html ==="

            sudo cat "$DEPLOY_DIR/index.html"

            echo "=== Deployed assets ==="

            sudo find "$DEPLOY_DIR/assets" \
              -maxdepth 1 \
              -type f \
              -print

            # ======================================
            # Verify old API IP is gone
            # ======================================

            if sudo grep -R -F "$OLD_API_IP" "$DEPLOY_DIR" >/dev/null 2>&1; then
              echo "ERROR: Old API IP exists in deployed files"
              exit 1
            fi

            # ======================================
            # Verify API URL
            # ======================================

            if ! sudo grep -R -F "$API_URL" "$DEPLOY_DIR" >/dev/null 2>&1; then
              echo "ERROR: HTTPS API URL missing from deployed files"
              exit 1
            fi

            echo "=== Deployed API URL verified ==="

            # ======================================
            # Nginx
            # ======================================

            echo "=== Testing Nginx ==="

            sudo nginx -t

            echo "=== Reloading Nginx ==="

            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="

            sudo systemctl is-active --quiet nginx

            # ======================================
            # Live website verification
            # ======================================

            echo "======================================"
            echo "Live Frontend Verification"
            echo "======================================"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              "$FRONTEND_URL/" \
              -o /tmp/finance-index.html

            if ! grep -qi '<!doctype html>' /tmp/finance-index.html; then
              echo "ERROR: Live response is not HTML"
              exit 1
            fi

            if ! grep -q 'id="root"' /tmp/finance-index.html; then
              echo "ERROR: React root element not found"
              exit 1
            fi

            echo "=== Live index.html verified ==="

            # ======================================
            # Verify live JS asset
            # ======================================

            LIVE_JS_PATH=$(
              sed -n \
              's/.*<script[^>]*src="\([^"]*\.js\)".*/\1/p' \
              /tmp/finance-index.html |
              head -n 1
            )

            if [ -z "$LIVE_JS_PATH" ]; then
              echo "ERROR: JS asset not found"
              exit 1
            fi

            echo "Live JS:"
            echo "$LIVE_JS_PATH"

            LIVE_JS_URL="${FRONTEND_URL}${LIVE_JS_PATH}"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              "$LIVE_JS_URL" \
              -o /tmp/finance-live.js

            # ======================================
            # Verify live JS API URL
            # ======================================

            if ! grep -F "$API_URL" /tmp/finance-live.js >/dev/null 2>&1; then
              echo "ERROR: HTTPS API URL not found in live JavaScript"
              exit 1
            fi

            if grep -F "$OLD_API_IP" /tmp/finance-live.js >/dev/null 2>&1; then
              echo "ERROR: Old API IP found in live JavaScript"
              exit 1
            fi

            echo "=== Live JavaScript verified ==="

            # ======================================
            # Cleanup
            # ======================================

            rm -f /tmp/finance-index.html
            rm -f /tmp/finance-live.js

            echo ""
            echo "======================================"
            echo "Finance frontend deployment SUCCESS"
            echo "======================================"

            echo "Commit:"
            git log -1 --oneline

            echo "Frontend:"
            echo "$FRONTEND_URL"

            echo "API:"
            echo "$API_URL"

            echo "Nginx root:"
            echo "$DEPLOY_DIR"

            echo "======================================"