name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "======================================"
            echo "Finance Frontend Deployment"
            echo "======================================"

            # --------------------------------------
            # Node.js
            # --------------------------------------

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            echo "=== Using Node 20 ==="

            nvm use 20

            echo "=== Node version ==="
            node -v

            echo "=== NPM version ==="
            npm -v


            # --------------------------------------
            # Repository
            # --------------------------------------

            echo "=== Going to repository root ==="

            cd "$HOME/Portals/Portal_Integration"

            echo "=== Repository ==="
            pwd

            echo "=== Git remote ==="
            git remote -v


            # --------------------------------------
            # Check for running Git processes
            # --------------------------------------

            echo "=== Checking for running Git processes ==="

            if pgrep -af "git.*Portal_Integration" >/dev/null; then
              echo "ERROR: Another Git process is currently running."
              echo "Deployment stopped to avoid corrupting the repository."
              pgrep -af "git.*Portal_Integration"
              exit 1
            fi


            # --------------------------------------
            # Remove stale Git locks
            # --------------------------------------

            echo "=== Checking Git lock files ==="

            if [ -f ".git/index.lock" ]; then
              echo "Found stale .git/index.lock"
              rm -f ".git/index.lock"
              echo "Removed .git/index.lock"
            fi

            if [ -f ".git/refs/remotes/origin/main.lock" ]; then
              echo "Found stale origin/main.lock"
              rm -f ".git/refs/remotes/origin/main.lock"
              echo "Removed origin/main.lock"
            fi


            # --------------------------------------
            # Git update
            # --------------------------------------

            echo "=== Pruning remote references ==="

            git remote prune origin || true

            echo "=== Fetching latest code ==="

            git fetch --prune origin

            echo "=== Resetting to latest main ==="

            git reset --hard origin/main

            echo "=== Current commit ==="

            git log -1 --oneline


            # --------------------------------------
            # Frontend
            # --------------------------------------

            echo "=== Going to frontend directory ==="

            cd "$HOME/Portals/Portal_Integration/frontend"

            echo "=== Installing dependencies ==="

            rm -rf node_modules

            npm ci


            # --------------------------------------
            # Build
            # --------------------------------------

            echo "=== Removing old build ==="

            rm -rf dist

            echo "=== Building frontend ==="

            npm run build


            # --------------------------------------
            # Verify API URL
            # --------------------------------------

            echo "=== Checking for old API IP ==="

            if grep -R "16.112.200.177" dist; then
              echo "ERROR: Old API IP found in build"
              exit 1
            fi

            echo "=== Checking API URL ==="

            if ! grep -R "finance.zynith-it.com/api" dist; then
              echo "ERROR: Correct API URL not found in build"
              exit 1
            fi

            echo "=== API URL verification successful ==="


            # --------------------------------------
            # Nginx
            # --------------------------------------

            echo "=== Reloading Nginx ==="

            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="

            sudo systemctl is-active nginx


            # --------------------------------------
            # Complete
            # --------------------------------------

            echo "======================================"
            echo "Finance frontend deployment completed"
            echo "======================================"