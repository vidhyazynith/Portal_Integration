name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Finance Frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "Finance Frontend Deployment"
            echo "======================================"

            echo "=== Checking server ==="
            whoami
            hostname
            pwd

            echo "=== Going to frontend directory ==="
            cd /home/ec2-user/Portals/Portal_Integration/frontend

            echo "=== Fixing Git remote references ==="

            # Remove stale remote-tracking references
            git remote prune origin || true

            # Remove the problematic origin/main reference
            git update-ref -d refs/remotes/origin/main || true

            echo "=== Fetching latest code ==="
            git fetch --prune origin

            echo "=== Resetting to latest main ==="
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Removing old build ==="
            rm -rf dist

            echo "=== Building frontend ==="
            npm run build

            echo "=== Checking build directory ==="
            if [ ! -d dist ]; then
              echo "ERROR: dist directory was not created"
              exit 1
            fi

            echo "=== Checking for old API IP ==="
            if grep -R "16.112.200.177" dist; then
              echo "ERROR: Old API IP found in build"
              exit 1
            fi

            echo "=== Checking correct API URL ==="
            if ! grep -R "finance.zynith-it.com/api" dist; then
              echo "ERROR: Correct API URL was not found in build"
              exit 1
            fi

            echo "=== Reloading Nginx ==="
            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="
            sudo systemctl is-active nginx

            echo "=== Testing website ==="
            curl -I https://finance.zynith-it.com

            echo "======================================"
            echo "Finance frontend deployment completed"
            echo "======================================"