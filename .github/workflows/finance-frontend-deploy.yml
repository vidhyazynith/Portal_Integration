name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ec2-user/frontend

            echo "=== Pulling latest frontend code ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Removing old build ==="
            rm -rf dist

            echo "=== Building frontend ==="
            npm run build

            echo "=== Checking for old API IP ==="
            if grep -R "16.112.200.177" dist; then
              echo "ERROR: Old API IP found in build"
              exit 1
            fi

            echo "=== Checking API URL ==="
            if ! grep -R "finance.zynith-it.com/api" dist; then
              echo "ERROR: Correct API URL not found in build"
              exit 1
            fi

            echo "=== Reloading Nginx ==="
            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="
            sudo systemctl is-active nginx

            echo "=== Finance frontend deployment completed ==="