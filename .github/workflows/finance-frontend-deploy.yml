name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -e

            echo "======================================"
            echo "Finance Frontend Deployment"
            echo "======================================"

            # ======================================
            # Node.js
            # ======================================

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM not found"
              exit 1
            fi

            source "$NVM_DIR/nvm.sh"

            echo "=== Using Node 20 ==="

            nvm use 20

            echo "=== Node version ==="
            node -v

            echo "=== NPM version ==="
            npm -v

            # ======================================
            # Repository
            # ======================================

            echo "=== Going to repository root ==="

            cd "$HOME/Portals/Portal_Integration"

            echo "=== Repository ==="
            pwd

            echo "=== Git remote ==="
            git remote -v

            # ======================================
            # Check active Git process
            # ======================================

            echo "=== Checking active Git processes ==="

            if pgrep -x git >/dev/null 2>&1; then
              echo "ERROR: Git process is currently running:"
              pgrep -ax git
              exit 1
            fi

            # ======================================
            # Remove stale Git locks
            # ======================================

            echo "=== Removing stale Git locks ==="

            rm -f "$HOME/Portals/Portal_Integration/.git/index.lock"
            rm -f "$HOME/Portals/Portal_Integration/.git/refs/remotes/origin/main.lock"

            # ======================================
            # Fetch
            # ======================================

            echo "=== Fetching latest main ==="

            git fetch origin main --prune

            # ======================================
            # Remove lock again
            # ======================================

            echo "=== Checking index lock before reset ==="

            if [ -f "$HOME/Portals/Portal_Integration/.git/index.lock" ]; then
              echo "Removing stale index.lock"
              rm -f "$HOME/Portals/Portal_Integration/.git/index.lock"
            fi

            # ======================================
            # Reset
            # ======================================

            echo "=== Resetting to latest main ==="

            git reset --hard origin/main

            echo "=== Current commit ==="

            git log -1 --oneline

            # ======================================
            # Frontend
            # ======================================

            echo "=== Going to frontend directory ==="

            cd "$HOME/Portals/Portal_Integration/frontend"

            echo "=== Installing dependencies ==="

            rm -rf node_modules

            npm ci

            echo "=== Removing old build ==="

            rm -rf dist

            echo "=== Building frontend ==="

            npm run build

            # ======================================
            # API validation
            # ======================================

            echo "=== Checking old API IP ==="

            if grep -R "16.112.200.177" dist; then
              echo "ERROR: Old API IP found in build"
              exit 1
            fi

            echo "=== Checking correct API URL ==="

            if ! grep -R "finance.zynith-it.com/api" dist; then
              echo "ERROR: Correct API URL not found"
              exit 1
            fi

            echo "=== API URL verification successful ==="

            # ======================================
            # Nginx
            # ======================================

            echo "=== Testing Nginx ==="

            sudo nginx -t

            echo "=== Reloading Nginx ==="

            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="

            sudo systemctl is-active --quiet nginx

            echo "======================================"
            echo "Finance frontend deployment completed"
            echo "======================================"