name: Finance Frontend Deploy

on:
  push:
    branches:
      - main

# Prevent two frontend deployments from running at the same time
concurrency:
  group: finance-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Finance Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -e

            echo "======================================"
            echo "Finance Frontend Deployment"
            echo "======================================"

            # --------------------------------------
            # Deployment lock
            # --------------------------------------

            LOCK_FILE="$HOME/.finance-frontend-deploy.lock"

            if [ -f "$LOCK_FILE" ]; then
              OLD_PID=$(cat "$LOCK_FILE" || true)

              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                echo "ERROR: Another frontend deployment is already running."
                echo "PID: $OLD_PID"
                exit 1
              else
                echo "Removing stale deployment lock..."
                rm -f "$LOCK_FILE"
              fi
            fi

            echo $$ > "$LOCK_FILE"

            cleanup() {
              rm -f "$LOCK_FILE"
            }

            trap cleanup EXIT

            # --------------------------------------
            # Node.js
            # --------------------------------------

            echo "=== Loading NVM ==="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            echo "=== Using Node 20 ==="
            nvm use 20

            echo "=== Node version ==="
            node -v

            echo "=== NPM version ==="
            npm -v

            # --------------------------------------
            # Repository
            # --------------------------------------

            echo "=== Going to repository root ==="

            cd "$HOME/Portals/Portal_Integration"

            echo "=== Repository ==="
            pwd

            echo "=== Git remote ==="
            git remote -v

            # --------------------------------------
            # Check stale lock files
            # --------------------------------------

            echo "=== Checking Git lock files ==="

            if [ -f ".git/index.lock" ]; then
              echo "Found .git/index.lock"

              # Only remove if no Git process is using the repository
              if ! pgrep -af "git" | grep -q "Portal_Integration"; then
                rm -f ".git/index.lock"
                echo "Removed stale .git/index.lock"
              else
                echo "ERROR: Git process is active."
                exit 1
              fi
            fi

            if [ -f ".git/refs/remotes/origin/main.lock" ]; then
              echo "Removing stale origin/main.lock"
              rm -f ".git/refs/remotes/origin/main.lock"
            fi

            # --------------------------------------
            # Git update
            # --------------------------------------

            echo "=== Fetching latest code ==="

            git fetch origin main --prune

            echo "=== Resetting to latest main ==="

            git reset --hard origin/main

            echo "=== Current commit ==="

            git log -1 --oneline

            # --------------------------------------
            # Frontend
            # --------------------------------------

            echo "=== Going to frontend directory ==="

            cd "$HOME/Portals/Portal_Integration/frontend"

            echo "=== Installing dependencies ==="

            rm -rf node_modules

            npm ci

            # --------------------------------------
            # Build
            # --------------------------------------

            echo "=== Removing old build ==="

            rm -rf dist

            echo "=== Building frontend ==="

            npm run build

            # --------------------------------------
            # Verify API configuration
            # --------------------------------------

            echo "=== Checking for old API IP ==="

            if grep -R "16.112.200.177" dist; then
              echo "ERROR: Old API IP found in build"
              exit 1
            fi

            echo "=== Checking API URL ==="

            if ! grep -R "finance.zynith-it.com/api" dist; then
              echo "ERROR: Correct API URL not found in build"
              exit 1
            fi

            echo "=== API URL verification successful ==="

            # --------------------------------------
            # Nginx
            # --------------------------------------

            echo "=== Testing Nginx configuration ==="

            sudo nginx -t

            echo "=== Reloading Nginx ==="

            sudo systemctl reload nginx

            echo "=== Checking Nginx ==="

            sudo systemctl is-active --quiet nginx

            echo "Nginx is active"

            # --------------------------------------
            # Complete
            # --------------------------------------

            echo "======================================"
            echo "Finance frontend deployment completed"
            echo "======================================"